# https://git-cliff.org/docs/configuration

[changelog]
header = ""
footer = ""
trim = true
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs?", group = "Documentation" },
  { message = "^revert", group = "Revert" },
  { message = "^chore|^ci|^style|^test|^build", skip = true },
]
filter_commits = false
sort_commits = "oldest"
topo_order_commits = true
